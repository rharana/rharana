<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-label="Rafael Harana - Software Design and Functionality">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="320" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#a855f7" stop-opacity="0.85"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.8"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="46"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#soft)">
      <circle r="150" fill="url(#b1)" cx="220" cy="120">
        <animate attributeName="cx" values="220;360;180;220" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;220;90;120" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" fill="url(#b2)" cx="520" cy="240">
        <animate attributeName="cx" values="520;640;460;520" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;120;260;240" dur="21s" repeatCount="indefinite"/>
      </circle>
      <circle r="160" fill="url(#b3)" cx="980" cy="90">
        <animate attributeName="cx" values="980;1080;900;980" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;200;70;90" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="url(#b4)" cx="1120" cy="260">
        <animate attributeName="cx" values="1120;1000;1150;1120" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;180;280;260" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="320" fill="url(#dots)"/>

    <g transform="translate(1000 168)" opacity="0.55">
      <circle r="72" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle r="108" fill="none" stroke="#22d3ee" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="2 11">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="none" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.4"/>
      <g>
        <circle cx="108" cy="0" r="4" fill="#22d3ee"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="72" cy="0" r="3" fill="#c084fc"/>
        <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="20s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(72 0)">
      <text x="0" y="90" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="4" fill="#22d3ee" fill-opacity="0.95">&lt;/&gt;&#160;&#160;SOFTWARE DESIGN &amp; FUNCTIONALITY</text>

      <g opacity="0">
        <text x="0" y="152" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Rafael Harana</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.15s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="0.9s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </g>

      <rect x="0" y="167" width="286" height="5" rx="2.5" fill="url(#accent)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
      </rect>

      <text x="0" y="216" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">Full-Stack Engineer<tspan fill="#22d3ee"> &#9612;<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="1.05s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.229;0.25;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="0" y="216" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">Cloud &amp; DevOps Practitioner<tspan fill="#22d3ee"> &#9612;<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="1.05s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.271;0.479;0.5;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="0" y="216" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">AI &amp; Agentic Systems<tspan fill="#22d3ee"> &#9612;<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="1.05s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.521;0.729;0.75;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="0" y="216" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#accent)">Software Architect<tspan fill="#22d3ee"> &#9612;<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.9;1" dur="1.05s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.771;0.979;1" dur="12s" repeatCount="indefinite"/></text>

      <text x="0" y="258" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#94a3b8" opacity="0">2+ yrs shipping&#160;&#160;&#8226;&#160;&#160;~10 yrs building&#160;&#160;&#8226;&#160;&#160;AWS Solutions Architect (in progress)<animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.9s" fill="freeze"/></text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
